<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Lembretes WhatsApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <!-- BEGIN favicon -->
      <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
      <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
      <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
      <link rel="manifest" href="/static/favicon/site.webmanifest">
      <link rel="mask-icon" href="/static/favicon/safari-pinned-tab.svg" color="#fc9d05">
      <link rel="shortcut icon" href="/static/favicon/favicon.ico">
      <meta name="msapplication-TileColor" content="#fc9d05">
      <meta name="msapplication-config" content="/static/favicon/browserconfig.xml">
      <meta name="theme-color" content="#fc9d05">
  <!-- END favicon -->

  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-50 min-h-screen">

<div class="max-w-7xl mx-auto p-6">
  <!-- Header -->
  <div class="flex justify-between items-center mb-8">
    <div>
      <h1 class="text-3xl font-bold text-gray-800 flex items-center gap-3">
          <i class="fa-brands fa-whatsapp"></i> Lembretes WhatsApp
      </h1>
      <p class="text-gray-600">Celsom Ferramentas • Offline</p>
    </div>
    <div class="flex gap-3">
      <button title="Recarregar" onclick="recarregar()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-xl flex items-center gap-2 transition">
        <i class="fas fa-sync"></i>
      </button>
      <button title="Enviar todas de hoje" onclick="enviarTodasHoje()" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl flex items-center gap-2 transition">
        <i class="fas fa-fast-forward"></i>
      </button>
      <button title="Backup" onclick="fazerBackup()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl flex items-center gap-2 transition">
        <i class="fas fa-download"></i>
      </button>
      <button title="Nova entrada" onclick="novaEntrada()" class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-xl flex items-center gap-2 font-medium transition">
        <i class="fas fa-plus"></i>
      </button>
    </div>
  </div>

  <!-- Tabela -->
  <div class="bg-white rounded-2xl shadow overflow-hidden">
    <table class="w-full">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-6 py-4 text-left text-sm font-medium text-gray-600">OS</th>
          <th class="px-6 py-4 text-left text-sm font-medium text-gray-600">Nome</th>
          <th class="px-6 py-4 text-left text-sm font-medium text-gray-600">Template</th>
          <th class="px-6 py-4 text-left text-sm font-medium text-gray-600">Parâmetros</th>
          <th class="px-6 py-4 text-left text-sm font-medium text-gray-600">Intervalo</th>
          <th class="px-6 py-4 text-left text-sm font-medium text-gray-600">Próximo Envio</th>
          <th class="px-6 py-4 text-center text-sm font-medium text-gray-600">Ações</th>
        </tr>
      </thead>
      <tbody id="tbody" class="divide-y"></tbody>
    </table>
  </div>
</div>

<!-- ==================== MODAL PREVIEW ==================== -->
<div id="modalPreview" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="modal bg-white rounded-2xl w-full max-w-lg mx-4 shadow-2xl">
    <div class="px-6 py-4 border-b flex justify-between items-center bg-gray-50 rounded-t-2xl">
      <h3 class="font-semibold text-lg" id="previewTitle">Preview da Mensagem</h3>
      <button onclick="fecharModal('modalPreview')" class="text-3xl leading-none text-gray-500 hover:text-gray-700">×</button>
    </div>
    <div id="previewContent" class="p-6 whitespace-pre-wrap text-gray-800 leading-relaxed max-h-[55vh] overflow-auto border-b"></div>
    
    <div class="p-4 bg-gray-50 rounded-b-2xl flex justify-between items-center">
      <button onclick="fecharModal('modalPreview')" 
              class="px-5 py-2 bg-gray-200 hover:bg-gray-300 rounded-xl">
        Fechar
      </button>
      <button onclick="enviarDoPreview()" 
              class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-xl flex items-center gap-2">
        <i class="fas fa-paper-plane"></i>
        Enviar Mensagem
      </button>
    </div>
  </div>
</div>

<!-- ==================== MODAL PARÂMETROS ==================== -->
<div id="modalParametros" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="modal bg-white rounded-2xl w-full max-w-2xl mx-4 shadow-2xl max-h-[90vh] flex flex-col">
    <div class="px-6 py-4 border-b bg-gray-50 rounded-t-2xl">
      <h3 class="font-semibold text-lg">Editar Parâmetros</h3>
      <p id="modalNomeCliente" class="text-sm text-gray-600"></p>
    </div>
    <div id="formParametros" class="flex-1 p-6 overflow-auto"></div>
    <div class="p-4 border-t bg-gray-50 rounded-b-2xl flex justify-end gap-3">
      <button onclick="fecharModal('modalParametros')" class="px-6 py-2 bg-gray-200 hover:bg-gray-300 rounded-xl">Cancelar</button>
      <button onclick="salvarParametros()" class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-xl">Salvar Alterações</button>
    </div>
  </div>
</div>

<!-- ==================== MODAL NOVA ENTRADA ==================== -->
<div id="modalNovaEntrada" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="modal bg-white rounded-2xl w-full max-w-2xl mx-4 shadow-2xl max-h-[95vh] flex flex-col">
    <div class="px-6 py-4 border-b bg-gray-50 rounded-t-2xl">
      <h3 class="font-semibold text-xl">Nova Entrada</h3>
    </div>

    <div class="flex-1 p-6 overflow-auto" id="formNovaEntrada">
      <!-- Conteúdo dinâmico via JS -->
    </div>

    <div class="p-4 border-t bg-gray-50 rounded-b-2xl flex justify-end gap-3">
      <button onclick="fecharModal('modalNovaEntrada')" class="px-6 py-2 bg-gray-200 hover:bg-gray-300 rounded-xl">Cancelar</button>
      <button onclick="salvarNovaEntrada()" class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-xl">Criar Entrada</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
